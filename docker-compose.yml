services:
  notes-app-db:
    image: "postgres:18"
    networks:
      - notes-app
    env_file:
      - ./db.env
    volumes:
      - pgdata:/var/lib/postgresql
      - "./notes-app-backend/init.sql:/docker-entrypoint-initdb.d/init.sql"
    ports:
      - "5432:5432"
  
  notes-app-backend:
    build: ./notes-app-backend
    env_file:
      - ./notes-app-backend/.env
    networks:
      - notes-app
    volumes:
      - ./notes-app-backend:/app
      - /app/node_modules
    depends_on:
      - notes-app-db
    ports:
      - "3000:3000"
    
  notes-app-frontend:
    build: ./notes-app-frontend
    env_file:
      - ./notes-app-frontend/.env
    volumes:
      - "./notes-app-frontend:/app"
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - notes-app-backend
networks:
  notes-app:
volumes:
  pgdata: